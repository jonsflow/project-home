<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Adventures Gallery - Jonathan Crissey</title>
    <meta name="description" content="Outdoor adventures - hiking, camping, and outdoor exploration.">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <h1><a href="../index.html" style="text-decoration:none;color:inherit;">Jonathan Crissey</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html#about">About</a></li>
                <li><a href="../index.html#projects">Projects</a></li>
                <li><a href="../index.html#galleries">Galleries</a></li>
                <li><a href="../index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="gallery-page">
            <div class="container">
                <h2>Outdoor Adventures</h2>
                <p>Hiking, camping, and outdoor exploration</p>
                <div class="galleries-grid" id="gallery-grid">
                    <div class="gallery-card">
                        <div class="gallery-image">
                            <img src="../images/outdoor/hiking-1.jpg" alt="Mountain hiking" loading="lazy">
                        </div>
                        <h3>Hiking</h3>
                        <p>Summit views after a challenging hike</p>
                    </div>
                    <div class="gallery-card">
                        <div class="gallery-image">
                            <img src="../images/outdoor/camping-1.jpg" alt="Camping adventures" loading="lazy">
                        </div>
                        <h3>Camping</h3>
                        <p>Peaceful camping under the stars</p>
                    </div>
                </div>
                <p style="margin-top:2rem;"><a href="../index.html#galleries">&larr; Back to Galleries</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="current-year">2025</span> Jonathan Crissey. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/gallery.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('#gallery-grid .gallery-card');
            cards.forEach((card, i) => {
                card.addEventListener('click', () => {
                    if (window.galleryUtils && window.galleryUtils.galleries.outdoor) {
                        window.galleryUtils.openLightbox(window.galleryUtils.galleries.outdoor.images, i);
                    }
                });
            });
            document.getElementById('current-year').textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
